<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Probant : classification des risques, procédures, formation et fiches de vigilance LCB-FT de votre agence immobilière. Vos données restent dans votre navigateur.">
<title>Probant — Dossier LCB-FT de l’agence</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314213d'/%3E%3Cpath d='M10 23V9h6.5a4.5 4.5 0 0 1 0 9H10' fill='none' stroke='%23f3c969' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root {
  --encre: #14213d; --encre-2: #24345a; --encre-3: #3c4a66; --gris: #5b6475; --gris-2: #8a93a6;
  --ligne: #d9dee8; --fond: #f4f6fa; --blanc: #fff; --or: #f3c969; --or-fonce: #b8892a;
  --vert: #1b5e34; --vert-fond: #e3f2e8; --ambre: #7a4f00; --ambre-fond: #fff1cc; --rouge: #9b1c14; --rouge-fond: #fde0de;
  --bleu-fond: #e8eefb; --rayon: 10px; --ombre: 0 1px 2px rgba(20, 33, 61, .06), 0 4px 16px rgba(20, 33, 61, .06);
  --police: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--police); font-size: 15px; line-height: 1.55; color: var(--encre); background: var(--fond); }
a { color: var(--encre-2); text-underline-offset: 2px; }
a:hover { color: var(--encre); }
h1, h2, h3, h4 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.65rem; letter-spacing: -.01em; }
h2 { font-size: 1.12rem; }
h3 { font-size: 1rem; margin-top: 1em; }
h4 { font-size: .95rem; margin-top: 1.2em; }
p { margin: 0 0 .8em; }
small { font-size: .82em; }
.visuellement-cache { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.lien-evitement { position: absolute; left: -999px; top: 0; background: var(--or); color: var(--encre); padding: .6em 1em; z-index: 100; font-weight: 600; }
.lien-evitement:focus { left: 1rem; top: 1rem; }
:focus-visible { outline: 3px solid #2f6fed; outline-offset: 2px; border-radius: 4px; }

/* Coque */
.coque { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
.barre-laterale { background: var(--encre); color: #dfe5f2; padding: 1.2rem .9rem; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.marque { display: flex; align-items: center; gap: .6rem; margin: 0 .4rem 1rem; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--or); color: var(--encre); display: grid; place-items: center; font-weight: 800; font-size: 1.15rem; }
.nom-marque { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: .01em; }
.btn-menu { display: none; margin-left: auto; background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.35); border-radius: 8px; padding: .35rem .7rem; font: inherit; cursor: pointer; }
.agence-courante { margin: 0 .4rem 1rem; font-size: .88rem; color: #fff; font-weight: 600; }
.licence { display: inline-block; margin-top: .3rem; font-size: .75rem; font-weight: 600; padding: .1rem .55rem; border-radius: 99px; }
.licence.ok { background: rgba(80, 200, 120, .18); color: #a8eac0; }
.licence.demo { background: rgba(243, 201, 105, .18); color: var(--or); }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav-groupe { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--gris-2); margin: 1rem .7rem .3rem; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: .5rem; padding: .5rem .7rem; border-radius: 8px; color: #dfe5f2; text-decoration: none; border-left: 3px solid transparent; }
.nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav a.actif { background: rgba(255,255,255,.1); color: #fff; border-left-color: var(--or); font-weight: 600; }
.nav-etat { font-size: .75rem; min-width: 1.3rem; height: 1.3rem; display: inline-grid; place-items: center; border-radius: 99px; }
.nav-etat.ok { background: rgba(80, 200, 120, .22); color: #a8eac0; }
.nav-etat.attention { background: rgba(243, 201, 105, .25); color: var(--or); }
.confidentialite { margin-top: auto; font-size: .78rem; color: var(--gris-2); padding: 1rem .4rem 0; }
main { padding: 1.6rem 2rem 3rem; min-width: 0; outline: none; }
.vue { max-width: 1240px; margin: 0 auto; }

/* Bandeaux */
.bandeau-info, .bandeau-alerte { max-width: 1240px; margin: 0 auto 1rem; padding: .6rem 1rem; border-radius: var(--rayon); font-size: .9rem; }
.bandeau-info { background: var(--bleu-fond); }
.bandeau-alerte { background: var(--rouge-fond); color: var(--rouge); font-weight: 600; }

/* En-têtes */
.entete-vue { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: space-between; margin-bottom: 1.2rem; }
.entete-vue .sous-titre { color: var(--encre-3); margin: .2rem 0 0; max-width: 70ch; }
.actions-entete { display: flex; flex-wrap: wrap; gap: .5rem; }
.fil { font-size: .85rem; color: var(--gris); margin-bottom: .4rem; }

/* Cartes et grilles */
.carte { background: var(--blanc); border: 1px solid var(--ligne); border-radius: var(--rayon); padding: 1.2rem 1.3rem; box-shadow: var(--ombre); margin-bottom: 1rem; }
.disposition-deux { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1rem; align-items: start; }
.panneau-collant { position: sticky; top: 1rem; }
.grille-tableau { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 1rem; }
.grille-tableau .carte-etapes { grid-row: span 2; }
.grille-docs { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
.titre-section { margin: 1.4rem 0 .7rem; }

/* Formulaires */
.formulaire h2 { margin-top: .2rem; }
.formulaire h2:not(:first-child) { margin-top: 1.4rem; }
.grille-champs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: .8rem 1rem; margin-bottom: .6rem; }
.champ { display: flex; flex-direction: column; gap: .3rem; min-width: 0; }
.champ-large { grid-column: 1 / -1; }
.champ label { font-weight: 600; font-size: .88rem; }
.requis { color: var(--rouge); }
input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="number"], select, textarea {
  font: inherit; color: var(--encre); background: #fff; border: 1px solid #b9c1d0; border-radius: 8px; padding: .55rem .7rem; min-height: 42px; width: 100%;
}
textarea { resize: vertical; min-height: 70px; }
input:focus, select:focus, textarea:focus { border-color: #2f6fed; }
.aide { color: var(--gris); font-size: .84rem; margin: .2rem 0 0; }
fieldset { border: 0; padding: 0; margin: 0 0 .6rem; min-width: 0; }
legend { font-weight: 600; padding: 0; margin-bottom: .4rem; font-size: .95rem; }
.choix { display: flex; flex-direction: column; gap: .35rem; }
.groupe-choix.en-ligne .choix { flex-direction: row; flex-wrap: wrap; gap: .4rem .6rem; }
.grille-2, .grille-3 { display: grid; gap: .35rem .8rem; }
.grille-2 { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grille-3 { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.option { display: flex; align-items: flex-start; gap: .55rem; padding: .45rem .65rem; border: 1px solid var(--ligne); border-radius: 8px; background: #fff; cursor: pointer; font-weight: 400; font-size: .92rem; }
.option:hover { border-color: #b9c1d0; background: #fafbfd; }
.option input { margin: .2rem 0 0; accent-color: var(--encre); width: 17px; height: 17px; flex: none; }
.option:has(input:checked) { border-color: var(--encre); background: #f1f4fa; }
.option.fort { border-left: 3px solid #e7a29c; }
.option small { color: var(--gris); display: block; }
.champ-case .option { border: 0; padding: .2rem 0; background: transparent; }

/* Boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .35rem; font: inherit; font-weight: 600; font-size: .9rem; border-radius: 8px; padding: .5rem .95rem; min-height: 40px; cursor: pointer; text-decoration: none; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.btn-primaire { background: var(--encre); color: #fff; }
.btn-primaire:hover { background: var(--encre-2); color: #fff; }
.btn-secondaire { background: #fff; color: var(--encre); border-color: #b9c1d0; }
.btn-secondaire:hover { border-color: var(--encre); color: var(--encre); }
.btn-danger { background: #fff; color: var(--rouge); border-color: #e7a29c; }
.btn-danger:hover { background: var(--rouge-fond); }
.btn-lien { background: none; border: 0; padding: 0; min-height: 0; color: var(--encre-2); text-decoration: underline; font-weight: 600; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.groupe-btn { display: inline-flex; flex-wrap: wrap; gap: .35rem; }
.groupe-btn .btn { padding: .35rem .65rem; min-height: 34px; font-size: .82rem; }
.suite { margin-top: 1rem; }

/* Badges, statuts, tags */
.badge { display: inline-block; padding: .12rem .6rem; border-radius: 99px; font-size: .8rem; font-weight: 700; white-space: nowrap; vertical-align: middle; }
.badge-1 { background: var(--vert-fond); color: var(--vert); }
.badge-2 { background: var(--ambre-fond); color: var(--ambre); }
.badge-3 { background: var(--rouge-fond); color: var(--rouge); }
.badge-0 { background: #eceef3; color: var(--gris); }
.statut { display: inline-flex; align-items: center; gap: .35rem; font-size: .88rem; font-weight: 600; }
.statut .icone { width: 1.25rem; height: 1.25rem; border-radius: 99px; display: inline-grid; place-items: center; font-size: .75rem; }
.statut-ok { color: var(--vert); } .statut-ok .icone { background: var(--vert-fond); }
.statut-attention { color: var(--ambre); } .statut-attention .icone { background: var(--ambre-fond); }
.statut-ko { color: var(--gris); } .statut-ko .icone { background: #eceef3; }
.tag { display: inline-block; font-size: .72rem; font-weight: 700; padding: .05rem .45rem; border-radius: 5px; background: #eceef3; color: var(--encre-3); text-transform: uppercase; letter-spacing: .03em; vertical-align: middle; }
.tag-risque { background: var(--ambre-fond); color: var(--ambre); }
.tag-fonction { background: var(--bleu-fond); color: var(--encre-2); }
.tag-fort { background: var(--rouge-fond); color: var(--rouge); }

/* Encadrés */
.encadre { border-radius: var(--rayon); padding: .8rem 1rem; margin-bottom: 1rem; border: 1px solid var(--ligne); background: #fff; }
.encadre ul { margin: .4rem 0 0; padding-left: 1.2rem; }
.encadre-info { background: var(--bleu-fond); border-color: #cfdaf3; }
.encadre-succes { background: var(--vert-fond); border-color: #bfe3cb; }
.encadre-attention { background: var(--ambre-fond); border-color: #f1dca0; }
.encadre-alerte { background: var(--rouge-fond); border-color: #f2b8b3; color: var(--rouge); }
.encadre-agence { background: #fbf7ec; border-color: #ecdcae; }

/* Tableau de bord */
.carte-pret { text-align: center; }
.jauge { position: relative; width: 132px; height: 132px; margin: .4rem auto .6rem; }
.jauge-fond { fill: none; stroke: #e8ebf1; stroke-width: 12; }
.jauge-valeur { fill: none; stroke: var(--encre); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray .4s; }
.jauge-texte { position: absolute; inset: 0; display: grid; place-content: center; }
.jauge-texte strong { font-size: 2rem; line-height: 1; }
.jauge-texte span { font-size: .78rem; color: var(--gris); }
.etapes { list-style: none; margin: 0; padding: 0; }
.etape { display: flex; align-items: center; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid #edf0f5; }
.etape:last-child { border-bottom: 0; }
.etape a { display: flex; flex-direction: column; text-decoration: none; color: var(--encre); flex: 1; }
.etape a span { color: var(--gris); font-size: .86rem; }
.pastille { width: 2rem; height: 2rem; border-radius: 99px; display: grid; place-items: center; background: #eceef3; color: var(--encre-3); font-weight: 700; flex: none; }
.etape.faite .pastille { background: var(--vert-fond); color: var(--vert); }
.etape.attention .pastille { background: var(--ambre-fond); color: var(--ambre); }
.a-faire { list-style: none; margin: 0; padding: 0; }
.a-faire li { display: flex; justify-content: space-between; gap: .6rem; align-items: center; padding: .45rem 0; border-bottom: 1px solid #edf0f5; }
.a-faire li.critique a { font-weight: 600; }
.succes { color: var(--vert); font-weight: 600; }
.axes-mini { list-style: none; margin: .4rem 0 .8rem; padding: 0; }
.axes-mini li { display: flex; justify-content: space-between; align-items: center; gap: .8rem; padding: .3rem 0; font-size: .88rem; }
.barre-mini { width: 90px; height: 7px; border-radius: 9px; background: #e8ebf1; overflow: hidden; flex: none; }
.barre-mini span { display: block; height: 100%; }
.barre-mini .niv-1 { background: #3d9a5f; } .barre-mini .niv-2 { background: #e0a72a; } .barre-mini .niv-3 { background: #c8453b; }
.chiffres { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin: 0; }
.chiffres div { background: var(--fond); border-radius: 8px; padding: .6rem .8rem; }
.chiffres dt { font-size: .8rem; color: var(--gris); }
.chiffres dd { margin: 0; font-size: 1.5rem; font-weight: 700; }
.lien { font-weight: 600; }

/* Classification */
.axe h2 { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.lettre { width: 1.8rem; height: 1.8rem; border-radius: 7px; background: var(--encre); color: var(--or); display: inline-grid; place-items: center; font-size: .95rem; }
.facteur { padding: .9rem 0; border-top: 1px solid #edf0f5; }
.niveau-facteur { margin: .2rem 0 0; }
.mesure { font-size: .86rem; color: var(--encre-3); background: var(--fond); padding: .45rem .7rem; border-radius: 8px; margin: .5rem 0 0; }
.ajustement { margin-top: .5rem; font-size: .88rem; }
.ajustement summary, details summary { cursor: pointer; color: var(--encre-2); font-weight: 600; font-size: .88rem; }
details[open] > summary { margin-bottom: .6rem; }
.progression { height: 8px; background: #e8ebf1; border-radius: 9px; overflow: hidden; margin: .3rem 0; }
.progression span { display: block; height: 100%; background: var(--encre); transition: width .3s; }
.resultat-global { margin: 1rem 0; font-weight: 600; }
.liste-compacte { margin: .3rem 0 1rem; padding-left: 1.1rem; font-size: .88rem; }
.liste-compacte li { margin-bottom: .3rem; }
.liste-statuts { list-style: none; padding: 0; }
.liste-statuts li { margin-bottom: .5rem; }

/* Tableaux */
.table-defilante { overflow-x: auto; }
.tableau { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tableau th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); font-weight: 700; padding: .5rem .6rem; border-bottom: 2px solid var(--ligne); }
.tableau td { padding: .65rem .6rem; border-bottom: 1px solid #edf0f5; vertical-align: top; }
.actions-ligne { display: flex; flex-wrap: wrap; gap: .4rem; align-items: flex-start; }
.edition { width: 100%; }
.liste-docs { list-style: none; margin: 0; padding: 0; }
.liste-docs li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid #edf0f5; }
.onglets { display: flex; gap: .3rem; margin-bottom: .8rem; }
.onglet { font: inherit; font-weight: 600; border: 1px solid var(--ligne); background: #fff; border-radius: 8px; padding: .4rem .9rem; cursor: pointer; color: var(--encre-3); }
.onglet.actif { background: var(--encre); color: #fff; border-color: var(--encre); }

/* Fiche de vigilance */
.partie { border-left: 4px solid var(--encre); }
.sous-bloc { background: var(--fond); border-radius: 8px; padding: .8rem; margin-bottom: .6rem; }
.evaluation { border-top: 5px solid var(--vert); }
.evaluation.niveau-renforcee { border-top-color: #e0a72a; }
.evaluation.niveau-bloquee { border-top-color: #c8453b; }
.libelle-niveau { font-size: 1.2rem; font-weight: 800; margin-bottom: .4rem; }
.niveau-standard .libelle-niveau { color: var(--vert); }
.niveau-renforcee .libelle-niveau { color: var(--ambre); }
.niveau-bloquee .libelle-niveau { color: var(--rouge); }
.liste-alertes { background: var(--rouge-fond); color: var(--rouge); border-radius: 8px; padding: .6rem .6rem .6rem 1.6rem; font-size: .86rem; }
.manquants li { color: var(--encre-3); }
.cloture { border-top: 1px solid var(--ligne); margin-top: 1rem; padding-top: 1rem; display: grid; gap: .6rem; }
.lecture-seule { opacity: .7; pointer-events: none; }

/* Formation */
.modules { padding-left: 1.2rem; }
.modules li { margin-bottom: .45rem; }
.module { max-width: 820px; }
.module p { font-size: 1.02rem; }
.navigation-module { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem; margin-top: 1.2rem; }
.quiz .question { padding: 1rem 0; border-top: 1px solid #edf0f5; }
.quiz .question legend { font-size: 1rem; }
.num { color: var(--gris); margin-right: .2rem; }
.resultat { text-align: center; }
.resultat .score, .score { font-size: 2.8rem; font-weight: 800; margin: .2rem 0; line-height: 1.1; }
.score small { font-size: 1rem; color: var(--gris); }
.resultat.reussi .score { color: var(--vert); }
.resultat.echoue .score { color: var(--rouge); }
.corrige li { margin-bottom: .8rem; }
.corrige li.faux { color: var(--rouge); }
.corrige li.faux .aide { color: var(--encre-3); }
.etapes-simples { padding-left: 1.2rem; }
.etapes-simples li { margin-bottom: .45rem; }
.point-controle { padding: .7rem 0; border-top: 1px solid #edf0f5; }
.journal { list-style: none; margin: 0; padding: 0; font-size: .86rem; max-height: 320px; overflow-y: auto; }
.journal li { padding: .3rem 0; border-bottom: 1px solid #edf0f5; }
.journal time { color: var(--gris); margin-right: .5rem; font-variant-numeric: tabular-nums; }

/* Modale d'aperçu */
body.modale-ouverte { overflow: hidden; }
.modale-fond { position: fixed; inset: 0; background: rgba(12, 20, 40, .55); z-index: 50; }
.modale { position: fixed; inset: 3vh 3vw; background: #fff; border-radius: 12px; z-index: 51; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.modale-entete { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem; padding: .8rem 1rem; border-bottom: 1px solid var(--ligne); }
.modale-entete h2 { margin: 0; font-size: 1.05rem; }
.modale-cadre { flex: 1; border: 0; width: 100%; background: #e9ecf2; }

/* Notifications */
.toast { position: fixed; right: 1.2rem; bottom: 1.2rem; max-width: 420px; background: var(--encre); color: #fff; padding: .8rem 1rem; border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.25); z-index: 60; opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; font-size: .92rem; }
.toast.visible { opacity: 1; transform: none; }
.toast-erreur { background: var(--rouge); }

/* Adaptation aux petits écrans */
@media (max-width: 1100px) {
  .disposition-deux { grid-template-columns: 1fr; }
  .panneau-collant { position: static; }
  .grille-tableau { grid-template-columns: 1fr; }
  .grille-tableau .carte-etapes { grid-row: auto; }
}
@media (max-width: 860px) {
  .coque { grid-template-columns: 1fr; }
  .barre-laterale { position: static; height: auto; padding: .8rem 1rem; }
  .btn-menu { display: inline-block; }
  .agence-courante, .confidentialite { display: none; }
  #nav-principale { display: none; }
  .menu-ouvert #nav-principale { display: block; }
  .marque { margin-bottom: 0; }
  main { padding: 1rem 1rem 3rem; }
  h1 { font-size: 1.35rem; }
  .grille-docs { grid-template-columns: 1fr; }
  .modale { inset: 0; border-radius: 0; }
}
@media print { .barre-laterale, .bandeau-info, .toast { display: none; } .coque { display: block; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

mat("fr-FR").format(h)+" \u20AC",E=[{id:"ppe",texte:"Partie ou b\xE9n\xE9ficiaire effectif qui est une personne politiquement expos\xE9e, ou un membre de sa famille ou un proche associ\xE9",ref:m.L561_10,active:!0},{id:"pays",texte:"Partie, b\xE9n\xE9ficiaire effectif ou fonds li\xE9s \xE0 un pays inscrit sur une liste du GAFI ou sur la liste UE des pays tiers \xE0 haut risque",ref:m.L561_10,active:!0},{id:"complexe",texte:"Op\xE9ration particuli\xE8rement complexe, d\u2019un montant inhabituellement \xE9lev\xE9 ou sans justification \xE9conomique apparente",ref:m.L561_10_2,active:!0},{id:"fonds",texte:"Origine des fonds non justifi\xE9e, ou incoh\xE9rente avec le profil du client",ref:m.L561_10_2,active:!0},{id:"comptant",texte:`Acquisition sans pr\xEAt bancaire d\u2019un montant de ${N(n.comptantRenforce)} ou plus`,ref:m.L561_4_1,active:!0},{id:"prestige",texte:`Bien de prestige (prix de ${N(n.prixPrestige)} ou plus)`,ref:m.L561_4_1,active:q("prestige")>=2||q("prixMoyen")===3},{id:"structures",texte:"Partie personne morale \xE9trang\xE8re, trust, fiducie ou structure \xE0 plusieurs niveaux de d\xE9tention",ref:m.L561_4_1,active:q("structuresComplexes")===3||q("personnesMorales")===3},{id:"distance",texte:"Partie identifi\xE9e exclusivement \xE0 distance, sans moyen d\u2019identification \xE9lectronique certifi\xE9",ref:m.R561_5,active:q("distance")>=2||q("plateformes")>=2},{id:"reventes",texte:"Revente moins de 2 ans apr\xE8s l\u2019acquisition, avec une plus-value significative",ref:m.L561_4_1,active:q("reventesRapides")===3},{id:"fondsCommerce",texte:"Cession d\u2019un fonds de commerce \xE0 forte intensit\xE9 d\u2019esp\xE8ces",ref:m.L561_4_1,active:q("fondsCommerce")>=2},{id:"locationHaut",texte:"Location dont le loyer mensuel atteint 10 000 \u20AC, pay\xE9e d\u2019avance, par un tiers ou depuis l\u2019\xE9tranger",ref:m.L561_2,active:q("locationHaut")===3},{id:"apporteurs",texte:"Client pr\xE9sent\xE9 par un apporteur d\u2019affaires ou un interm\xE9diaire",ref:m.L561_4_1,active:q("apporteurs")>=2}];return{facteurs:r,axes:s,global:{niveau:f,libelle:Oe[f].libelle},indice:x,complet:l,repondus:a,total:ae.length,situations:E.filter(h=>h.active),seuils:n,ajustements:r.filter(h=>h.ajuste)}}var re=[{id:"refusPieces",libelle:"R\xE9ticence \xE0 fournir des pi\xE8ces, ou pi\xE8ces douteuses, retouch\xE9es ou incoh\xE9rentes",fort:!0},{id:"pretenom",libelle:"Indices de pr\xEAte-nom : celui qui paie ou d\xE9cide n\u2019est pas l\u2019acqu\xE9reur d\xE9clar\xE9",fort:!0},{id:"societeRecente",libelle:"Soci\xE9t\xE9 acqu\xE9reuse r\xE9cente, peu capitalis\xE9e ou sans activit\xE9 r\xE9elle, qui ach\xE8te comptant",fort:!0},{id:"especes",libelle:"Proposition de r\xE9gler une partie du prix ou de la commission en esp\xE8ces",fort:!0},{id:"montageComplexe",libelle:"Montage juridique ou financier complexe sans justification \xE9conomique apparente",fort:!0},{id:"paysSanctions",libelle:"Lien avec un pays sous sanctions ou une personne vis\xE9e par des mesures restrictives",fort:!0},{id:"prixAnormal",libelle:"Prix nettement sup\xE9rieur ou inf\xE9rieur au march\xE9, accept\xE9 sans n\xE9gociation",fort:!1},{id:"sansVisite",libelle:"Acquisition sans visite ni int\xE9r\xEAt pour les caract\xE9ristiques du bien",fort:!1},{id:"urgence",libelle:"Urgence inhabituelle ou demande de discr\xE9tion injustifi\xE9e",fort:!1},{id:"substitution",libelle:"Substitution d\u2019acqu\xE9reur ou changement de b\xE9n\xE9ficiaire en cours de processus",fort:!1},{id:"fondsFractionnes",libelle:"Fonds fractionn\xE9s, venant de plusieurs comptes ou de tiers sans lien apparent",fort:!1},{id:"incoherenceProfil",libelle:"Incoh\xE9rence entre l\u2019op\xE9ration et le profil (\xE2ge, revenus, activit\xE9 d\xE9clar\xE9e)",fort:!1},{id:"reventeRapide",libelle:"Revente rapide d\u2019un bien acquis r\xE9cemment, avec une plus-value inexpliqu\xE9e",fort:!1},{id:"remunerationAtypique",libelle:"Demande de commission atypique (vers\xE9e \xE0 un tiers, sur un compte \xE9tranger, en esp\xE8ces)",fort:!1}];var se=[{id:"dirigeant",libelle:"Dirigeant ou titulaire de la carte professionnelle"},{id:"responsable",libelle:"Responsable LCB-FT ou d\xE9clarant Tracfin"},{id:"negociateur",libelle:"N\xE9gociateur salari\xE9"},{id:"agentCommercial",libelle:"Agent commercial (mandataire ind\xE9pendant)"},{id:"assistant",libelle:"Assistant(e), accueil ou gestion administrative"},{id:"support",libelle:"Fonction support (comptabilit\xE9, direction administrative)"}],$e=e=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(e)+" \u20AC",Zt=e=>e.split("-").reverse().join("/"),Re=[{id:"enjeux",titre:"Pourquoi l\u2019immobilier est expos\xE9 au blanchiment",duree:4,socle:!0,paragraphes:()=>["Blanchir, c\u2019est donner une apparence licite \xE0 des fonds d\u2019origine criminelle : trafics, escroqueries, corruption, fraude fiscale\u2026 Le financement du terrorisme consiste \xE0 fournir des fonds, m\xEAme d\u2019origine licite, \xE0 une entreprise terroriste.","L\u2019immobilier est un v\xE9hicule privil\xE9gi\xE9 : des montants \xE9lev\xE9s, des biens durables qui conservent leur valeur, la possibilit\xE9 d\u2019interposer des soci\xE9t\xE9s, et une revente qui \xAB recycle \xBB les fonds. L\u2019Analyse nationale des risques publi\xE9e en 2023 classe le secteur immobilier \xE0 risque \xE9lev\xE9.","Les agents immobiliers sont donc des \xAB professionnels assujettis \xBB (art. L. 561-2 du Code mon\xE9taire et financier). Vous n\u2019\xEAtes pas enqu\xEAteur, mais vous devez conna\xEEtre vos clients, comprendre les op\xE9rations, d\xE9tecter les anomalies et les signaler \xE0 Tracfin, le service de renseignement financier du minist\xE8re de l\u2019\xC9conomie."],points:()=>["Sont concern\xE9es les transactions (vente, achat) et les locations dont le loyer mensuel atteint 10 000 \u20AC.","La DGCCRF contr\xF4le les agences ; la Commission nationale des sanctions prononce les sanctions.","Tout le dispositif de l\u2019agence d\xE9coule de sa classification des risques."],pratique:e=>{let t=e.cls.axes.filter(i=>i.niveau===3).map(i=>i.titre.toLowerCase());return[`Profil d\u2019exposition de votre agence : ${e.cls.global.libelle.toLowerCase()} (indice ${e.cls.indice}/100).`,t.length?`Axes les plus expos\xE9s : ${t.join(" ; ")}.`:"Aucun axe n\u2019est class\xE9 \xE0 risque \xE9lev\xE9 : la vigilance standard s\u2019applique, avec des mesures renforc\xE9es au cas par cas."]}},{id:"obligations",titre:"Vos obligations de vigilance, \xE9tape par \xE9tape",duree:7,socle:!0,paragraphes:()=>["Avant de signer un mandat ou d\u2019assister un client dans une transaction, l\u2019agence identifie son client et v\xE9rifie son identit\xE9 sur un document probant : pi\xE8ce d\u2019identit\xE9 officielle en cours de validit\xE9, avec photographie, pour une personne physique ; extrait d\u2019immatriculation de moins de trois mois pour une personne morale, avec l\u2019identit\xE9 de son repr\xE9sentant (art. L. 561-5 et R. 561-5 CMF).","Par prudence, et parce que le r\xE8glement europ\xE9en AMLR le rendra explicite au 10 juillet 2027, la proc\xE9dure de l\u2019agence pr\xE9voit l\u2019identification des deux parties \xE0 la vente : votre mandant et son cocontractant.","Vous recueillez aussi l\u2019objet et la nature de l\u2019op\xE9ration (r\xE9sidence principale, investissement locatif, revente\u2026) et vous les consignez (art. L. 561-5-1).","La vigilance est constante : si un \xE9l\xE9ment change (substitution d\u2019acqu\xE9reur, nouveau financement, nouvel intervenant), la fiche est mise \xE0 jour et le risque r\xE9\xE9valu\xE9 (art. L. 561-6).","Le niveau de vigilance d\xE9pend du risque. Il est renforc\xE9 notamment pour les personnes politiquement expos\xE9es, en cas de lien avec un pays \xE0 haut risque et pour les op\xE9rations complexes ou inhabituelles (art. L. 561-10 et L. 561-10-2).","Si vous ne parvenez pas \xE0 identifier une partie ou \xE0 v\xE9rifier son identit\xE9, vous ne poursuivez pas l\u2019op\xE9ration et vous vous interrogez sur une d\xE9claration de soup\xE7on (art. L. 561-8)."],points:()=>["Identifier n\u2019est pas v\xE9rifier : la v\xE9rification se fait sur pi\xE8ce probante.","Une fiche de vigilance par op\xE9ration, compl\xE9t\xE9e avant l\u2019avant-contrat.","Sans identit\xE9 v\xE9rifi\xE9e, pas d\u2019op\xE9ration."],pratique:e=>{let t=["Dans l\u2019agence, la fiche de vigilance est ouverte d\xE8s la signature du mandat et compl\xE9t\xE9e avant le compromis ou la promesse de vente."];return e.n("distance")>=2&&t.push("Vous concluez parfois \xE0 distance : appliquez la mesure compl\xE9mentaire pr\xE9vue par la proc\xE9dure (identification \xE9lectronique certifi\xE9e ou seconde pi\xE8ce justificative)."),t}},{id:"beppe",titre:"B\xE9n\xE9ficiaire effectif, personnes politiquement expos\xE9es et gel des avoirs",duree:6,socle:!0,paragraphes:()=>["B\xE9n\xE9ficiaire effectif : lorsqu\u2019une partie est une soci\xE9t\xE9 (SCI, SAS\u2026), il faut remonter jusqu\u2019aux personnes physiques qui d\xE9tiennent, directement ou indirectement, plus de 25 % du capital ou des droits de vote, ou qui exercent un contr\xF4le par un autre moyen (art. R. 561-1 CMF). Consultez le registre des b\xE9n\xE9ficiaires effectifs et documentez tout \xE9cart avec les d\xE9clarations du client.","Personne politiquement expos\xE9e (PPE) : personne qui exerce, ou a cess\xE9 depuis moins d\u2019un an, une fonction publique importante (chef d\u2019\xC9tat, ministre, parlementaire, membre d\u2019une haute juridiction, dirigeant de banque centrale, ambassadeur, officier g\xE9n\xE9ral, dirigeant d\u2019entreprise publique ou d\u2019organisation internationale\u2026), ainsi que les membres de sa famille et ses proches associ\xE9s (art. R. 561-18). La relation n\u2019est pas interdite, mais elle exige des mesures compl\xE9mentaires : origine du patrimoine et des fonds, d\xE9cision d\u2019entrer en relation prise par le dirigeant, suivi renforc\xE9.","Gel des avoirs : certaines personnes et entit\xE9s font l\u2019objet de mesures de gel nationales, europ\xE9ennes ou onusiennes. Avant l\u2019op\xE9ration, v\xE9rifiez chaque partie et chaque b\xE9n\xE9ficiaire effectif sur le registre national des gels de la DG Tr\xE9sor, et notez la date et le r\xE9sultat. En cas de correspondance confirm\xE9e : aucune mise \xE0 disposition de fonds ou de biens, aucune op\xE9ration, et information sans d\xE9lai de la DG Tr\xE9sor (art. L. 562-1 et suivants)."],points:()=>["B\xE9n\xE9ficiaire effectif : plus de 25 % du capital ou des droits de vote, ou un contr\xF4le de fait.","PPE : question syst\xE9matique, validation par le dirigeant.","Gel : v\xE9rification dat\xE9e pour chaque partie et chaque b\xE9n\xE9ficiaire effectif."],pratique:e=>{let t=[];return e.n("personnesMorales")>=2&&t.push("Vous traitez r\xE9guli\xE8rement avec des personnes morales : chaque fiche de vigilance exige au moins un b\xE9n\xE9ficiaire effectif par soci\xE9t\xE9."),e.n("ppe")>=2&&t.push("Votre classification retient un risque PPE : la question est pos\xE9e pour chaque partie et chaque b\xE9n\xE9ficiaire effectif."),t.push("Registre national des gels : https://gels-avoirs.dgtresor.gouv.fr"),t}},{id:"fonds",titre:"Origine des fonds et coh\xE9rence de l\u2019op\xE9ration",duree:5,socle:!0,paragraphes:e=>["Le notaire n\u2019est pas votre bouclier : chaque professionnel assujetti a ses propres obligations. Le 17 f\xE9vrier 2026, la Commission nationale des sanctions a sanctionn\xE9 une agence et son dirigeant pour une seule vente de 290 000 \u20AC : l\u2019origine des fonds n\u2019\xE9tait pas document\xE9e et le dossier ne permettait pas d\u2019analyser le risque.",`Documentez syst\xE9matiquement le plan de financement : pr\xEAt (offre ou accord de principe), apport personnel et sa provenance. \xC0 partir de ${$e(e.seuils.origineFondsMontant)} d\u2019apport, ou de ${e.seuils.origineFondsPart} % du prix financ\xE9 sans pr\xEAt (seuils fix\xE9s par l\u2019agence), obtenez des justificatifs : relev\xE9s de compte, acte de vente d\u2019un bien ant\xE9rieur, acte de donation ou de succession, contrat de pr\xEAt familial, cession de parts\u2026`,`Appr\xE9ciez la coh\xE9rence : l\u2019op\xE9ration correspond-elle \xE0 l\u2019\xE2ge, aux revenus, \xE0 la profession et au patrimoine d\xE9clar\xE9s ? Le prix est-il coh\xE9rent avec le march\xE9 ? Une acquisition sans pr\xEAt bancaire de ${$e(e.seuils.comptantRenforce)} ou plus, ou des fonds venant de l\u2019\xE9tranger, justifient une vigilance renforc\xE9e.`],points:()=>["Un plan de financement document\xE9 dans chaque fiche.","Des justificatifs au-del\xE0 du seuil interne.","La coh\xE9rence entre profil, op\xE9ration et prix."],pratique:e=>[`Seuils internes de l\u2019agence : justificatifs d\u2019origine des fonds d\xE8s ${$e(e.seuils.origineFondsMontant)} d\u2019apport ou ${e.seuils.origineFondsPart} % du prix ; vigilance renforc\xE9e d\xE8s ${$e(e.seuils.comptantRenforce)} sans pr\xEAt.`]},{id:"signaux",titre:"Les signaux d\u2019alerte en transaction immobili\xE8re",duree:5,socle:!0,paragraphes:()=>["Un signal d\u2019alerte n\u2019est pas une preuve : c\u2019est un \xE9l\xE9ment inhabituel qui doit vous conduire \xE0 poser des questions, \xE0 approfondir et, si le doute persiste, \xE0 alerter le d\xE9clarant.","Un signal isol\xE9, expliqu\xE9 de fa\xE7on cr\xE9dible et justifi\xE9e, peut \xEAtre lev\xE9 : notez l\u2019explication et les pi\xE8ces. Plusieurs signaux, ou un signal fort non expliqu\xE9, doivent \xEAtre transmis au d\xE9clarant."],points:()=>re.map(e=>e.libelle+(e.fort?" (signal fort)":"")),pratique:e=>{let t=[];return e.n("comptant")>=2&&t.push("Surveillez particuli\xE8rement les acquisitions sans pr\xEAt et l\u2019origine des apports."),(e.n("personnesMorales")>=2||e.n("structuresComplexes")===3)&&t.push("Surveillez les soci\xE9t\xE9s r\xE9centes ou peu capitalis\xE9es qui ach\xE8tent comptant."),(e.n("nonResidents")>=2||e.n("fondsEtrangers")>=2)&&t.push("Surveillez les fonds venant de l\u2019\xE9tranger, a fortiori d\u2019un pays inscrit sur une liste."),e.n("reventesRapides")===3&&t.push("Surveillez les reventes rapides avec forte plus-value."),t.length?t:["Gardez en t\xEAte la liste compl\xE8te des signaux : c\u2019est souvent leur accumulation qui alerte."]}},{id:"declaration",titre:"Alerte interne et d\xE9claration de soup\xE7on",duree:5,socle:!0,paragraphes:e=>["La d\xE9claration de soup\xE7on est due d\xE8s que vous savez, soup\xE7onnez ou avez de bonnes raisons de soup\xE7onner que des sommes ou une op\xE9ration proviennent d\u2019une infraction passible de plus d\u2019un an d\u2019emprisonnement, ou participent au financement du terrorisme (art. L. 561-15 CMF). Il n\u2019est pas n\xE9cessaire d\u2019avoir une preuve, ni de qualifier l\u2019infraction.",`Dans l\u2019agence, tout collaborateur qui a un doute alerte sans d\xE9lai ${e.declarant?e.declarant+" (d\xE9clarant Tracfin)":"le d\xE9clarant Tracfin d\xE9sign\xE9"}, de fa\xE7on confidentielle, en d\xE9crivant les faits. Le d\xE9clarant analyse, d\xE9cide et, le cas \xE9ch\xE9ant, transmet la d\xE9claration \xE0 Tracfin sur la plateforme ERMES.`,"La d\xE9claration intervient en principe avant la r\xE9alisation de l\u2019op\xE9ration : Tracfin peut s\u2019y opposer (art. L. 561-24). Une d\xE9claration faite de bonne foi n\u2019engage pas la responsabilit\xE9 de son auteur (art. L. 561-22).","La confidentialit\xE9 est absolue : il est interdit de r\xE9v\xE9ler au client ou \xE0 un tiers l\u2019existence ou le contenu d\u2019une d\xE9claration (art. L. 561-18). La divulgation est punie de 22 500 \u20AC d\u2019amende (art. L. 574-1)."],points:()=>["Le doute suffit.","L\u2019alerte se fait en interne, aupr\xE8s du d\xE9clarant, jamais aupr\xE8s du client.","La d\xE9claration passe par ERMES, si possible avant l\u2019op\xE9ration."],pratique:e=>[e.declarant?`D\xE9clarant Tracfin de l\u2019agence : ${e.declarant}.`:"Le d\xE9clarant Tracfin n\u2019est pas encore d\xE9sign\xE9 : le dirigeant doit le d\xE9signer et l\u2019enregistrer sur ERMES."]},{id:"conservation",titre:"Conservation et tra\xE7abilit\xE9",duree:3,socle:!0,paragraphes:()=>["Les documents d\u2019identification et les pi\xE8ces relatives aux op\xE9rations sont conserv\xE9s 5 ans \xE0 compter de la fin de la relation ou de l\u2019ex\xE9cution de l\u2019op\xE9ration (art. L. 561-12 CMF). Ils doivent pouvoir \xEAtre produits rapidement lors d\u2019un contr\xF4le.","Depuis le d\xE9cret du 24 avril 2026, les justificatifs de formation (programme, dates, personnes form\xE9es, attestations, supports) sont conserv\xE9s pendant toute la dur\xE9e des fonctions du collaborateur, puis 5 ans apr\xE8s son d\xE9part (art. D. 561-38-1-1).","Une conformit\xE9 \xAB d\xE9clarative \xBB ne suffit plus : l\u2019inspecteur v\xE9rifie dans les dossiers que les diligences ont r\xE9ellement \xE9t\xE9 faites. Ce qui n\u2019est pas \xE9crit n\u2019existe pas."],points:()=>["Pi\xE8ces : 5 ans apr\xE8s la fin de la relation ou de l\u2019op\xE9ration.","Formation : pendant les fonctions, puis 5 ans apr\xE8s le d\xE9part.","Ce qui n\u2019est pas trac\xE9 n\u2019existe pas."],pratique:()=>["Probant calcule la date de fin de conservation de chaque fiche et de chaque attestation."]},{id:"sanctions",titre:"Les sanctions encourues",duree:5,socle:!0,obligatoire:!0,paragraphes:()=>["Sanctions administratives. La DGCCRF contr\xF4le les agences et peut saisir la Commission nationale des sanctions (CNS). La CNS peut prononcer un avertissement, un bl\xE2me, une interdiction temporaire d\u2019exercer l\u2019activit\xE9 ou des fonctions de direction (jusqu\u2019\xE0 5 ans, \xE9ventuellement avec sursis), le retrait de la carte professionnelle, et une sanction p\xE9cuniaire pouvant atteindre 5 millions d\u2019euros (art. L. 561-40 CMF). Les d\xE9cisions sont publi\xE9es, souvent de fa\xE7on nominative.","Ces sanctions peuvent viser personnellement le dirigeant ainsi que les salari\xE9s et pr\xE9pos\xE9s impliqu\xE9s dans les manquements.","Exemples r\xE9cents : interdiction de 3 mois avec sursis et 4 000 \u20AC d\u2019amende pour une soci\xE9t\xE9 de transaction et son dirigeant (mars 2024 : absence de cartographie des risques, de formation et de contr\xF4le interne) ; interdiction de 2 ans avec sursis, 15 000 \u20AC pour la soci\xE9t\xE9 et 5 000 \u20AC pour le dirigeant (juin 2024 : manquements \xE0 la quasi-totalit\xE9 des obligations) ; interdiction avec sursis et 10 000 \u20AC d\u2019amende pour le dirigeant (f\xE9vrier 2026 : origine des fonds non document\xE9e sur une vente de 290 000 \u20AC).","Sanctions p\xE9nales. Le blanchiment, y compris le fait d\u2019apporter son concours \xE0 une op\xE9ration de blanchiment, est puni de 5 ans d\u2019emprisonnement et de 375 000 \u20AC d\u2019amende, port\xE9s \xE0 10 ans et 750 000 \u20AC lorsqu\u2019il est commis de fa\xE7on habituelle ou en utilisant les facilit\xE9s d\u2019une activit\xE9 professionnelle (art. 324-1 et 324-2 du Code p\xE9nal). La divulgation d\u2019une d\xE9claration de soup\xE7on est punie de 22 500 \u20AC d\u2019amende.","Au-del\xE0 de la sanction elle-m\xEAme, la publication de la d\xE9cision et l\u2019interdiction d\u2019exercer, m\xEAme avec sursis, ont un co\xFBt d\u2019image et un co\xFBt commercial consid\xE9rables pour une agence."],points:()=>["CNS : de l\u2019avertissement \xE0 l\u2019interdiction d\u2019exercer, et jusqu\u2019\xE0 5 M\u20AC.","Des sanctions personnelles sont possibles pour le dirigeant et les collaborateurs.","Blanchiment : 5 ans et 375 000 \u20AC ; s\u2019il est aggrav\xE9, 10 ans et 750 000 \u20AC."],pratique:()=>["Ce module est obligatoire pour chaque collaborateur (art. D. 561-38-1-1 CMF)."]},{id:"etrangers",titre:"Client\xE8le \xE9trang\xE8re, non-r\xE9sidents et pays \xE0 risque",duree:4,si:e=>e.n("nonResidents")>=2||e.n("paysRisque")===3||e.n("offshore")>=2||e.n("fondsEtrangers")>=2||["frontalier","prestige"].includes(e.r("zone")),paragraphes:()=>["Une client\xE8le \xE9trang\xE8re n\u2019est pas suspecte en soi. Elle complique en revanche la v\xE9rification (documents \xE9trangers, b\xE9n\xE9ficiaires effectifs hors de France) et peut impliquer des pays \xE0 risque.",`Pour chaque partie et chaque b\xE9n\xE9ficiaire effectif, renseignez la nationalit\xE9, le pays de r\xE9sidence et le pays de provenance des fonds. Probant les compare aux listes du GAFI (\xE9tat au ${Zt(A.gafiGrise.date)}) et de l\u2019Union europ\xE9enne (\xE9tat au ${Zt(A.ue.date)}).`,"Pays de la liste noire du GAFI (Iran, Cor\xE9e du Nord, Myanmar) : examen au cas par cas avec le dirigeant, et contre-mesures pour l\u2019Iran et la Cor\xE9e du Nord. Pays de la liste grise ou de la liste UE : mesures de vigilance renforc\xE9es (justificatifs de l\u2019origine des fonds, validation par le dirigeant, suivi renforc\xE9).","Ces listes changent plusieurs fois par an. V\xE9rifiez la date des listes affich\xE9e dans l\u2019outil."],points:()=>["Nationalit\xE9, r\xE9sidence et provenance des fonds : pour chaque partie et chaque b\xE9n\xE9ficiaire.","Pays inscrit sur une liste : vigilance renforc\xE9e.","Liste noire : d\xE9cision du dirigeant, au cas par cas."]},{id:"societes",titre:"SCI, soci\xE9t\xE9s et structures complexes",duree:4,si:e=>e.n("personnesMorales")>=2||e.n("structuresComplexes")===3||e.n("neufInvest")>=2,paragraphes:()=>["Les soci\xE9t\xE9s permettent d\u2019acqu\xE9rir sans appara\xEEtre. C\u2019est leur int\xE9r\xEAt l\xE9gitime (gestion patrimoniale, transmission) et c\u2019est aussi leur risque (soci\xE9t\xE9s \xE9crans, pr\xEAte-noms).","Pour chaque soci\xE9t\xE9 : un extrait d\u2019immatriculation de moins de 3 mois, les statuts \xE0 jour, l\u2019identit\xE9 du repr\xE9sentant, les b\xE9n\xE9ficiaires effectifs (plus de 25 % ou un contr\xF4le) et la consultation du registre des b\xE9n\xE9ficiaires effectifs. Pour une structure \xE9trang\xE8re, un trust ou plusieurs niveaux de d\xE9tention, reconstituez la cha\xEEne jusqu\u2019aux personnes physiques et faites justifier l\u2019int\xE9r\xEAt du montage.","Signaux : soci\xE9t\xE9 r\xE9cente et peu capitalis\xE9e qui ach\xE8te comptant, si\xE8ge dans un territoire \xE0 fiscalit\xE9 tr\xE8s faible, associ\xE9s de fa\xE7ade, refus d\u2019indiquer les b\xE9n\xE9ficiaires effectifs."],points:()=>["Pas de fiche \xAB soci\xE9t\xE9 \xBB sans b\xE9n\xE9ficiaire effectif identifi\xE9.","Structure \xE9trang\xE8re ou multi-niveaux : examen renforc\xE9.","Refus de transparence : signal fort."]},{id:"prestige",titre:"Biens de prestige et montants \xE9lev\xE9s",duree:3,si:e=>e.n("prestige")>=2||e.n("prixMoyen")===3||e.n("biensAtypiques")>=2,paragraphes:e=>["Plus le montant est \xE9lev\xE9, plus le bien est attractif pour placer des fonds illicites, et plus un \xE9cart de prix permet de transf\xE9rer de la valeur entre les parties.",`Pour un bien de prestige (${$e(e.seuils.prixPrestige)} ou plus) : vigilance renforc\xE9e syst\xE9matique, origine du patrimoine de l\u2019acqu\xE9reur, coh\xE9rence du prix (motivez tout \xE9cart par \xE9crit) et validation par le dirigeant.`,"En 2025, des op\xE9rations de contr\xF4le inopin\xE9es de la DGCCRF ont vis\xE9 des agences de prestige (Saint-Tropez, ouest parisien)."],points:()=>["Bien de prestige : vigilance renforc\xE9e syst\xE9matique.","Tout \xE9cart de prix est motiv\xE9 par \xE9crit."]},{id:"comptant",titre:"Acquisitions sans cr\xE9dit et financements atypiques",duree:3,si:e=>e.n("comptant")>=2||e.n("tiersPayeurs")>=2||e.n("fondsEtrangers")>=2,paragraphes:e=>["Sans pr\xEAt, aucune banque n\u2019a analys\xE9 les fonds de l\u2019acqu\xE9reur : votre vigilance est la seule barri\xE8re avant le notaire.",`\xC0 partir de ${$e(e.seuils.comptantRenforce)} sans pr\xEAt, la vigilance est renforc\xE9e : relev\xE9s montrant l\u2019origine des fonds, justificatif de l\u2019\xE9v\xE9nement qui les a g\xE9n\xE9r\xE9s (vente, donation, succession, cession d\u2019entreprise), coh\xE9rence avec le profil.`,"Apports de tiers : identifiez le tiers, son lien avec l\u2019acqu\xE9reur et la nature juridique de l\u2019apport. Des fonds fractionn\xE9s ou venant de comptes multiples doivent \xEAtre expliqu\xE9s."],points:()=>["Pas de pr\xEAt : justificatifs d\u2019origine obligatoires au-del\xE0 du seuil.","Tiers apporteur : identifi\xE9, lien et nature de l\u2019apport document\xE9s."]},{id:"distance",titre:"Relation \xE0 distance",duree:3,si:e=>e.n("distance")>=2||e.n("plateformes")>=2,paragraphes:()=>["Un client jamais rencontr\xE9 est plus difficile \xE0 identifier avec certitude : usurpation d\u2019identit\xE9, faux documents.","Hors pr\xE9sence physique, la v\xE9rification doit reposer sur un moyen d\u2019identification \xE9lectronique fiable, ou \xEAtre compl\xE9t\xE9e par les mesures pr\xE9vues par les textes (par exemple une seconde pi\xE8ce justificative, ou un premier paiement depuis un compte ouvert au nom du client : art. R. 561-5-1 et suivants CMF).","Une photo de pi\xE8ce d\u2019identit\xE9 envoy\xE9e par e-mail ne suffit pas, \xE0 elle seule."],points:()=>["\xC0 distance : identification \xE9lectronique fiable ou mesure compl\xE9mentaire.","Une photo envoy\xE9e par e-mail ne suffit pas."]},{id:"intermediaires",titre:"Agents commerciaux et apporteurs d\u2019affaires",duree:3,si:e=>e.n("agentsCommerciaux")>=2||e.n("apporteurs")>=2,paragraphes:()=>["Les agents commerciaux qui travaillent pour l\u2019agence participent aux obligations : ils appliquent les proc\xE9dures, ils sont form\xE9s et ils figurent dans le registre de formation.","Les apporteurs d\u2019affaires et les interm\xE9diaires ne vous dispensent pas de vos propres diligences. Identifiez votre client r\xE9el, ne vous contentez pas des informations transmises par l\u2019interm\xE9diaire et m\xE9fiez-vous des r\xE9mun\xE9rations atypiques."],points:()=>["Agents commerciaux : m\xEAmes proc\xE9dures, m\xEAme formation.","Interm\xE9diaire : il ne remplace jamais vos diligences."]},{id:"location",titre:"Locations de 10 000 \u20AC par mois et plus",duree:3,si:e=>e.n("locationHaut")===3,paragraphes:()=>["Ces locations entrent dans le champ de la LCB-FT (art. L. 561-2 CMF). Identifiez et v\xE9rifiez le bailleur et le preneur, ainsi que leurs b\xE9n\xE9ficiaires effectifs.","Signaux : loyers pay\xE9s d\u2019avance sur de longues p\xE9riodes, paiement par un tiers ou depuis l\u2019\xE9tranger, preneur qui est une soci\xE9t\xE9 \xE9cran."],points:()=>["Bailleur et preneur identifi\xE9s et v\xE9rifi\xE9s.","Paiements anticip\xE9s, par un tiers ou depuis l\u2019\xE9tranger : \xE0 justifier."]},{id:"fondsCommerce",titre:"Cessions de fonds de commerce",duree:3,si:e=>e.n("fondsCommerce")>=2,paragraphes:()=>["Les commerces \xE0 forte intensit\xE9 d\u2019esp\xE8ces peuvent servir \xE0 blanchir, notamment par un chiffre d\u2019affaires gonfl\xE9.","Comparez le prix au chiffre d\u2019affaires et \xE0 la rentabilit\xE9, documentez l\u2019origine des fonds de l\u2019acqu\xE9reur, et identifiez les b\xE9n\xE9ficiaires effectifs des soci\xE9t\xE9s c\xE9dante et cessionnaire."],points:()=>["Prix compar\xE9 au chiffre d\u2019affaires.","Origine des fonds de l\u2019acqu\xE9reur document\xE9e."]},{id:"investisseurs",titre:"Programmes neufs, investisseurs et ventes en bloc",duree:2,si:e=>e.n("neufInvest")>=2||e.n("investisseurs")>=2,paragraphes:()=>["Pour les ventes en bloc et les acquisitions multiples par un m\xEAme investisseur, identifiez le b\xE9n\xE9ficiaire effectif de chaque structure, comprenez l\u2019objet de l\u2019op\xE9ration et la provenance des fonds, en particulier lorsqu\u2019ils viennent de l\u2019\xE9tranger."],points:()=>["Chaque structure acqu\xE9reuse a son b\xE9n\xE9ficiaire effectif.","L\u2019objet de l\u2019investissement est consign\xE9."]},{id:"roleDirigeant",titre:"Vos responsabilit\xE9s de dirigeant",duree:4,fonctions:["dirigeant"],paragraphes:()=>["Le dispositif LCB-FT rel\xE8ve de la responsabilit\xE9 de l\u2019agence et de son dirigeant, m\xEAme lorsque des t\xE2ches sont d\xE9l\xE9gu\xE9es. Vous validez la classification des risques et les proc\xE9dures, vous d\xE9signez le d\xE9clarant et le correspondant Tracfin, vous organisez la formation et vous contr\xF4lez l\u2019application des proc\xE9dures.","Vous d\xE9cidez dans les situations \xE0 risque : entr\xE9e en relation avec une PPE, op\xE9rations en vigilance renforc\xE9e, refus d\u2019op\xE9ration.","Au moins une fois par an : auto-contr\xF4le, revue d\u2019un \xE9chantillon de fiches de vigilance, mise \xE0 jour de la classification et du plan de formation.","La CNS peut vous sanctionner personnellement, y compris par une interdiction d\u2019exercer des fonctions de direction."],points:()=>["Vous validez, d\xE9signez, formez et contr\xF4lez.","Vous d\xE9cidez des cas en vigilance renforc\xE9e.","Auto-contr\xF4le au moins annuel."]},{id:"roleDeclarant",titre:"Le d\xE9clarant et le correspondant Tracfin",duree:4,fonctions:["responsable"],paragraphes:()=>["Le d\xE9clarant est habilit\xE9 \xE0 \xE9tablir, signer et transmettre les d\xE9clarations \xE0 Tracfin (art. R. 561-23 CMF). Le correspondant r\xE9pond aux demandes de Tracfin (art. R. 561-24). La m\xEAme personne peut tenir les deux r\xF4les, qui doivent \xEAtre enregistr\xE9s sur la plateforme ERMES.","\xC0 r\xE9ception d\u2019une alerte interne : accusez r\xE9ception, analysez les pi\xE8ces, documentez votre analyse (m\xEAme si vous concluez \xE0 l\u2019absence de soup\xE7on) et d\xE9cidez rapidement, id\xE9alement avant l\u2019avant-contrat.","La d\xE9claration se fait sur ERMES. Elle est pr\xE9cise et factuelle : identit\xE9 des personnes, description de l\u2019op\xE9ration, \xE9l\xE9ments atypiques, montants, dates, pi\xE8ces. Conservez la d\xE9claration et l\u2019accus\xE9 de r\xE9ception \xE0 part, de fa\xE7on strictement confidentielle.","R\xE9pondez dans les d\xE9lais aux demandes de communication de pi\xE8ces de Tracfin."],points:()=>["Chaque alerte est analys\xE9e et l\u2019analyse est \xE9crite.","D\xE9clarations sur ERMES, factuelles et document\xE9es.","Archivage s\xE9par\xE9 et confidentiel."]},{id:"roleTerrain",titre:"Au contact du client",duree:3,fonctions:["negociateur","agentCommercial"],paragraphes:()=>["Vous \xEAtes les premiers \xE0 voir le client. Vous recueillez les pi\xE8ces, vous posez les questions sur l\u2019objet de l\u2019op\xE9ration et le financement, vous rep\xE9rez les signaux d\u2019alerte pendant les visites et les n\xE9gociations.","Expliquez simplement la d\xE9marche : \xAB La loi nous impose de v\xE9rifier l\u2019identit\xE9 et l\u2019origine des fonds de toutes les parties. \xBB Un client honn\xEAte le comprend ; un refus est en soi un signal.","En cas de doute : ne le dites pas au client, alertez imm\xE9diatement le d\xE9clarant et notez les faits."],points:()=>["Pi\xE8ces et financement : d\xE8s le premier rendez-vous.","Un doute se dit au d\xE9clarant, jamais au client."]},{id:"roleSupport",titre:"Contr\xF4le des pi\xE8ces et archivage",duree:3,fonctions:["assistant","support"],paragraphes:()=>["Vous v\xE9rifiez la qualit\xE9 des pi\xE8ces : validit\xE9, coh\xE9rence des noms, des dates et des signatures, absence de retouches, extrait d\u2019immatriculation de moins de 3 mois.","Vous assurez le classement et l\u2019archivage : une fiche par op\xE9ration, des pi\xE8ces faciles \xE0 retrouver, une conservation de 5 ans et un acc\xE8s r\xE9serv\xE9 aux personnes habilit\xE9es.","Une anomalie documentaire (document illisible, incoh\xE9rence, suspicion de faux) se signale au d\xE9clarant, sans en parler au client."],points:()=>["Pi\xE8ces v\xE9rifi\xE9es, pas seulement collect\xE9es.","Une anomalie se signale au d\xE9clarant."]}],Xt=[{id:"q01",sections:["enjeux"],q:"Selon l\u2019Analyse nationale des risques publi\xE9e en 2023, le secteur immobilier pr\xE9sente un risque de blanchiment :",o:["Faible","Mod\xE9r\xE9","\xC9lev\xE9"],c:2,e:"L\u2019ANR classe l\u2019immobilier \xE0 risque \xE9lev\xE9, en raison de son poids dans l\u2019\xE9conomie, de son attractivit\xE9 et de son dynamisme."},{id:"q02",sections:["obligations"],q:"Avant d\u2019assister un client dans une transaction, vous devez :",o:["Identifier le client et v\xE9rifier son identit\xE9 sur pi\xE8ce probante, ainsi que celle du b\xE9n\xE9ficiaire effectif le cas \xE9ch\xE9ant","Noter son nom ; le notaire v\xE9rifiera","Attendre la signature de l\u2019acte authentique"],c:0,e:"Identification et v\xE9rification interviennent avant l\u2019entr\xE9e en relation ou l\u2019assistance \xE0 la transaction (art. L. 561-5 CMF)."},{id:"q03",sections:["obligations"],q:"Vous ne parvenez pas \xE0 v\xE9rifier l\u2019identit\xE9 d\u2019une partie. Que faites-vous ?",o:["Je poursuis : le notaire s\u2019en chargera","Je ne poursuis pas l\u2019op\xE9ration et j\u2019examine avec le d\xE9clarant s\u2019il faut faire une d\xE9claration de soup\xE7on","Je demande une attestation sur l\u2019honneur et je poursuis"],c:1,e:"Sans identit\xE9 v\xE9rifi\xE9e, l\u2019op\xE9ration ne doit pas \xEAtre r\xE9alis\xE9e (art. L. 561-8 CMF)."},{id:"q04",sections:["obligations"],q:"En cours de mandat, l\u2019acqu\xE9reur est remplac\xE9 par une autre personne. Vous :",o:["Mettez \xE0 jour la fiche de vigilance et r\xE9\xE9valuez le risque","Ne faites rien : la fiche initiale suffit","Annulez le mandat"],c:0,e:"La vigilance est constante (art. L. 561-6) ; une substitution d\u2019acqu\xE9reur est aussi un signal d\u2019alerte \xE0 examiner."},{id:"q05",sections:["beppe","societes"],q:"Le b\xE9n\xE9ficiaire effectif d\u2019une SCI acqu\xE9reuse est notamment :",o:["Le notaire charg\xE9 de la vente","La personne physique qui d\xE9tient, directement ou indirectement, plus de 25 % du capital ou des droits de vote, ou qui exerce un contr\xF4le","Le g\xE9rant de l\u2019agence"],c:1,e:"Art. R. 561-1 CMF : plus de 25 % du capital ou des droits de vote, ou un pouvoir de contr\xF4le."},{id:"q06",sections:["beppe"],q:"Une personne politiquement expos\xE9e (PPE), c\u2019est :",o:["Toute personne qui a d\xE9j\xE0 vot\xE9","Une personne qui exerce, ou a cess\xE9 depuis moins d\u2019un an, une fonction publique importante, ainsi que sa famille et ses proches associ\xE9s","Uniquement un \xE9lu local"],c:1,e:"Art. R. 561-18 CMF."},{id:"q07",sections:["beppe"],q:"L\u2019acqu\xE9reur est une PPE. Quelle est la bonne r\xE9ponse ?",o:["L\u2019op\xE9ration est interdite","Aucune mesure particuli\xE8re n\u2019est requise","Mesures compl\xE9mentaires : origine du patrimoine et des fonds, et d\xE9cision d\u2019entrer en relation prise par le dirigeant"],c:2,e:"Une PPE n\u2019est pas interdite de transaction, mais impose une vigilance compl\xE9mentaire (art. L. 561-10 CMF)."},{id:"q08",sections:["beppe"],q:"Le registre national des gels des avoirs fait appara\xEEtre une correspondance confirm\xE9e avec l\u2019acqu\xE9reur. Vous :",o:["Ne r\xE9alisez aucune op\xE9ration et informez sans d\xE9lai la DG Tr\xE9sor","Demandez au client de s\u2019expliquer et poursuivez","Pr\xE9venez le client pour qu\u2019il r\xE9gularise"],c:0,e:"Aucune mise \xE0 disposition de fonds ou de biens au profit d\u2019une personne gel\xE9e (art. L. 562-1 et suivants CMF)."},{id:"q09",sections:["fonds","comptant","etrangers"],q:"Un acqu\xE9reur sans emprunt pr\xE9sente un apport de 600 000 \u20AC venant d\u2019un compte \xE0 l\u2019\xE9tranger. Vous :",o:["Ne demandez rien : ce n\u2019est pas votre r\xF4le","Demandez et conservez des justificatifs de l\u2019origine des fonds et appr\xE9ciez leur coh\xE9rence","Refusez syst\xE9matiquement l\u2019op\xE9ration"],c:1,e:"L\u2019origine des fonds se documente ; un refus syst\xE9matique n\u2019est pas requis, mais un d\xE9faut de justification doit alerter."},{id:"q10",sections:["fonds"],q:"Quel a \xE9t\xE9 le motif principal de la sanction de la CNS du 17 f\xE9vrier 2026 contre une agence et son dirigeant ?",o:["Une faute d\u2019orthographe dans l\u2019annonce","L\u2019absence d\u2019\xE9l\xE9ments sur l\u2019origine des fonds, qui rendait l\u2019op\xE9ration impossible \xE0 analyser","Un mandat exclusif mal r\xE9dig\xE9"],c:1,e:"Une seule vente \xE0 290 000 \u20AC sans justification de l\u2019origine des fonds a suffi."},{id:"q11",sections:["signaux","prestige"],q:"Lequel de ces \xE9l\xE9ments est un signal d\u2019alerte ?",o:["Un couple qui obtient un pr\xEAt immobilier classique","Un acqu\xE9reur qui accepte un prix nettement sup\xE9rieur au march\xE9, sans visite ni n\xE9gociation","Un vendeur qui pr\xE9sente son titre de propri\xE9t\xE9"],c:1,e:"Prix anormal accept\xE9 sans n\xE9gociation et absence de visite : deux signaux classiques."},{id:"q12",sections:["signaux","societes"],q:"Une soci\xE9t\xE9 cr\xE9\xE9e il y a deux mois, au capital de 1 000 \u20AC, ach\xE8te comptant un bien \xE0 1,2 M\u20AC. Le bon r\xE9flexe :",o:["Aucun : les soci\xE9t\xE9s ach\xE8tent souvent","Demander uniquement l\u2019extrait Kbis","Examen renforc\xE9 (b\xE9n\xE9ficiaire effectif, origine des fonds, justification \xE9conomique) et transmission au d\xE9clarant si le doute persiste"],c:2,e:"Soci\xE9t\xE9 r\xE9cente, peu capitalis\xE9e, achat comptant : un signal fort qui impose un examen renforc\xE9 (art. L. 561-10-2)."},{id:"q13",sections:["signaux"],q:"Un client propose de r\xE9gler une partie du prix en esp\xE8ces :",o:["C\u2019est un signal d\u2019alerte fort : les paiements en esp\xE8ces sont strictement plafonn\xE9s","C\u2019est acceptable en dessous de 50 000 \u20AC","C\u2019est sans importance, le notaire g\xE8re les fonds"],c:0,e:"Les paiements en esp\xE8ces sont plafonn\xE9s (art. L. 112-6 CMF) ; la proposition elle-m\xEAme doit alerter."},{id:"q14",sections:["declaration"],q:"La d\xE9claration de soup\xE7on \xE0 Tracfin est due lorsque :",o:["Vous d\xE9tenez la preuve d\u2019un d\xE9lit","Vous savez, soup\xE7onnez ou avez de bonnes raisons de soup\xE7onner que les fonds proviennent d\u2019une infraction ou financent le terrorisme","Le montant d\xE9passe 1 million d\u2019euros"],c:1,e:"Art. L. 561-15 CMF : le soup\xE7on suffit, aucun seuil ne s\u2019applique."},{id:"q15",sections:["declaration","roleTerrain","roleSupport"],q:"Un collaborateur a un doute sur un dossier. Il doit :",o:["En parler au client pour lever le doute","Alerter sans d\xE9lai le d\xE9clarant, de fa\xE7on confidentielle, en notant les faits","Attendre la fin de la vente"],c:1,e:"L\u2019alerte est interne et imm\xE9diate ; le client ne doit jamais \xEAtre inform\xE9."},{id:"q16",sections:["declaration"],q:"Pouvez-vous informer le client qu\u2019une d\xE9claration de soup\xE7on a \xE9t\xE9 faite ?",o:["Oui, par transparence","Oui, s\u2019il le demande","Non : c\u2019est interdit et puni de 22 500 \u20AC d\u2019amende"],c:2,e:"Confidentialit\xE9 de la d\xE9claration (art. L. 561-18) ; sanction p\xE9nale (art. L. 574-1 CMF)."},{id:"q17",sections:["declaration","roleDeclarant"],q:"Quand faut-il, en principe, effectuer la d\xE9claration de soup\xE7on ?",o:["Avant de r\xE9aliser l\u2019op\xE9ration, Tracfin pouvant s\u2019y opposer","Un an apr\xE8s la vente","Jamais avant la signature de l\u2019acte"],c:0,e:"Tracfin dispose d\u2019un droit d\u2019opposition (art. L. 561-24 CMF)."},{id:"q18",sections:["roleDeclarant"],q:"Par quel canal le d\xE9clarant transmet-il une d\xE9claration de soup\xE7on ?",o:["Par e-mail \xE0 la DGCCRF","Sur la plateforme ERMES de Tracfin","Par courrier au notaire"],c:1,e:"Les d\xE9clarations se font sur ERMES, o\xF9 le d\xE9clarant et le correspondant sont enregistr\xE9s."},{id:"q19",sections:["conservation"],q:"Combien de temps faut-il conserver les pi\xE8ces d\u2019identification et les fiches de vigilance ?",o:["1 an","5 ans \xE0 compter de la fin de la relation ou de l\u2019ex\xE9cution de l\u2019op\xE9ration","30 ans"],c:1,e:"Art. L. 561-12 CMF."},{id:"q20",sections:["conservation"],q:"Depuis le d\xE9cret du 24 avril 2026, les justificatifs de formation LCB-FT doivent \xEAtre conserv\xE9s :",o:["Pendant 6 mois","Pendant toute la dur\xE9e des fonctions, puis 5 ans apr\xE8s le d\xE9part du collaborateur","Ils n\u2019ont pas \xE0 \xEAtre conserv\xE9s"],c:1,e:"Art. D. 561-38-1-1 CMF."},{id:"q21",sections:["sanctions"],q:"Quelles sanctions la Commission nationale des sanctions peut-elle prononcer ?",o:["Un simple rappel \xE0 la loi","Avertissement, bl\xE2me, interdiction temporaire d\u2019exercer (jusqu\u2019\xE0 5 ans), retrait de la carte, amende jusqu\u2019\xE0 5 M\u20AC","Des amendes inf\xE9rieures \xE0 1 000 \u20AC uniquement"],c:1,e:"Art. L. 561-40 CMF."},{id:"q22",sections:["sanctions","roleDirigeant"],q:"La CNS peut-elle sanctionner personnellement le dirigeant et les collaborateurs ?",o:["Non, seule la soci\xE9t\xE9 peut \xEAtre sanctionn\xE9e","Oui, le dirigeant ainsi que les salari\xE9s ou pr\xE9pos\xE9s impliqu\xE9s","Non, seul le titulaire de la carte peut l\u2019\xEAtre"],c:1,e:"Les sanctions peuvent viser les personnes physiques impliqu\xE9es."},{id:"q23",sections:["sanctions"],q:"Le d\xE9lit de blanchiment est puni de :",o:["6 mois d\u2019emprisonnement et 1 500 \u20AC d\u2019amende","5 ans d\u2019emprisonnement et 375 000 \u20AC d\u2019amende (10 ans et 750 000 \u20AC s\u2019il est aggrav\xE9)","Une amende administrative uniquement"],c:1,e:"Art. 324-1 et 324-2 du Code p\xE9nal."},{id:"q24",sections:["enjeux","roleDirigeant"],q:"La classification des risques de l\u2019agence doit \xEAtre :",o:["Propre \xE0 l\u2019agence, \xE9crite, motiv\xE9e et mise \xE0 jour","Un mod\xE8le recopi\xE9 d\u2019une autre agence","Facultative pour les petites agences"],c:0,e:"Art. L. 561-4-1 CMF : un mod\xE8le recopi\xE9 n\u2019est pas individualis\xE9."},{id:"q25",sections:["roleDirigeant"],q:"Qui est responsable de la mise en place du dispositif LCB-FT de l\u2019agence ?",o:["La banque de l\u2019acqu\xE9reur","Le notaire","L\u2019agence et son dirigeant, m\xEAme lorsque des t\xE2ches sont d\xE9l\xE9gu\xE9es"],c:2,e:"La personne assujettie reste responsable de son dispositif."},{id:"q26",sections:["distance"],q:"Un acqu\xE9reur jamais rencontr\xE9 envoie une photo de son passeport par e-mail. Est-ce suffisant ?",o:["Oui","Non : il f <h2>1. Objet et méthode</h2>
<p>Ce document constitue la classification des risques de blanchiment de capitaux et de financement du terrorisme de l’agence, établie en application de l’${m.L561_4_1}. Il identifie et évalue les risques selon les cinq axes prévus par le texte : la nature des produits ou services offerts, les conditions des transactions proposées, les canaux de distribution utilisés, les caractéristiques des clients et le pays ou territoire d’origine ou de destination des fonds.</p>
<p>Chaque facteur est évalué sur trois niveaux (faible, modéré, élevé) à partir des données d’activité déclarées par l’agence. Un axe prend le niveau de son facteur le plus élevé, une règle prudente qui se justifie aisément lors d’un contrôle. Le profil global est élevé si deux axes au moins sont élevés ou si la somme des niveaux des axes atteint 11 sur 15, et modéré si un axe est élevé ou si cette somme atteint 7.</p>
<div class="encadre">L’Analyse nationale des risques publiée en 2023 classe le secteur immobilier à <strong>risque élevé</strong>. Le profil ci-dessous mesure l’exposition propre de l’agence au sein de ce secteur : il ne réduit aucune obligation légale et sert à proportionner les mesures de vigilance, les procédures et la formation des collaborateurs (${m.D561_38_1_1}).</div>

<h2>1. Objet, champ d’application et références</h2>
<p>Les présentes procédures décrivent l’organisation mise en place par l’agence pour respecter ses obligations de lutte contre le blanchiment de capitaux et le financement du terrorisme (LCB-FT), en application de l’${m.L561_32}. Elles s’appliquent à toutes les personnes qui participent, même ponctuellement, aux opérations de l’agence : dirigeant, salariés, agents commerciaux, assistants et fonctions support.</p>
<p>Activités concernées : intermédiation dans les opérations d’achat et de vente de biens immobiliers${r("fondsCommerce")>=2?", cessions de fonds de commerce":""}${r("locationHaut")===3?", locations dont le loyer mensuel est \xE9gal ou sup\xE9rieur \xE0 10 000 \u20AC":""} (${m.L561_2}). Elles s’appuient sur la classification des risques de l’agence (${m.L561_4_1}), dont elles déclinent les mesures.</p>

<h2>3. Classification des risques</h2>
<p>Le profil d’exposition de l’agence est <strong>${t.global.libelle.toLowerCase()}</strong> (indice ${t.indice}/100). La classification est revue au moins une fois par an et à chaque changement significatif d’activité, de clientèle ou de réglementation. Toute révision entraîne la mise à jour des présentes procédures et du plan de formation.</p>

<h2>4. Entrée en relation : identification et vérification</h2>
<p><strong>Quand ?</strong> Une fiche de vigilance est ouverte pour chaque opération dès la signature du mandat. Elle est complétée avant la signature de l’avant-contrat (compromis ou promesse) et, au plus tard, avant l’acte authentique.</p>
<p><strong>Qui ?</strong> L’agence identifie et vérifie l’identité de son client (mandant) et, par prudence, celle de son cocontractant, ainsi que, le cas échéant, leurs représentants et leurs bénéficiaires effectifs (${m.L561_5}). Le ${m.AMLR}, rendra explicite la vérification des deux parties.</p>
<p><strong>Comment ?</strong> Sur présentation de l’original d’un document officiel en cours de validité comportant une photographie (personne physique). Pour une personne morale : extrait d’immatriculation de moins de trois mois, statuts, identité et pouvoir du représentant (${m.R561_5}). La pièce vérifiée, sa date de validité, la date de vérification et le nom du vérificateur sont consignés.</p>
${r("distance")>=2||s.has("distance")?o`<p><strong>À distance.</strong> Lorsque la personne n’est pas physiquement présente, la vérification se fait par un moyen d’identification électronique certifié ou est complétée par une mesure prévue par les textes (seconde pièce justificative, premier paiement depuis un compte au nom du client…). Une simple copie de pièce ne suffit pas et place l’opération en vigilance renforcée.</p>`:""}
<p><strong>Bénéficiaires effectifs.</strong> Pour toute personne morale, l’agence identifie la ou les personnes physiques qui détiennent, directement ou indirectement, plus de 25 % du capital ou des droits de vote, ou qui exercent un contrôle (${m.R561_1}). Elle consulte le registre des bénéficiaires effectifs et documente tout écart avec les informations du client.</p>
<p><strong>PPE.</strong> Pour chaque partie et chaque bénéficiaire effectif, l’agence détermine s’il s’agit d’une personne politiquement exposée, d’un membre de sa famille ou d’un proche associé (${m.R561_18}) : déclaration de la personne, recherches et, le cas échéant, bases spécialisées.</p>

<h2>5. Connaissance de l’opération et origine des fonds</h2>
<p>L’agence recueille l’objet et la nature de l’opération (${m.L561_5_1}) et le plan de financement. L’origine des fonds est justifiée par des pièces dès que l’apport personnel atteint ${B(t.seuils.origineFondsMontant)} ou ${t.seuils.origineFondsPart} % du prix : relevés de compte, acte de vente antérieur, acte de donation ou de succession, contrat de prêt, acte de cession… L’agence apprécie la cohérence entre l’opération, le prix et le profil des parties.</p>

<h2>6. Niveaux de vigilance</h2>
<p><strong>Vigilance standard</strong> : mesures des sections 4 et 5. <strong>Vigilance renforcée</strong> dans les situations définies par la classification :</p>
<ul>${t.situations.map(c=>o`<li>${c.texte}</li>`)}</ul>
<p>En vigilance renforcée : justificatifs complémentaires sur l’origine du patrimoine et des fonds, examen renforcé écrit (${m.L561_10_2}), décision de poursuivre prise par le dirigeant (nom et date dans la fiche), suivi renforcé jusqu’à l’acte (${m.L561_10}).</p>

<h2>7. Vigilance constante</h2>
<p>Jusqu’à la conclusion de l’opération, la fiche est mise à jour à chaque changement : substitution d’acquéreur, nouveau financement, nouvel intervenant, modification du prix (${m.L561_6}). Chaque changement donne lieu à une réévaluation du niveau de vigilance.</p>

<h2>8. Gel des avoirs</h2>
<p>Avant l’opération, chaque partie et chaque bénéficiaire effectif sont recherchés sur le registre national des gels (${U.gels.url}). La date et le résultat sont consignés. En cas d’homonymie, les éléments d’identification (date de naissance, nationalité) permettent de lever le doute, ce qui est également consigné. En cas de correspondance confirmée, aucune opération n’est réalisée, aucun fonds ni bien n’est mis à disposition et la DG Trésor est informée sans délai (${m.L562_1}).</p>

<h2>9. Signaux d’alerte, alerte interne et déclaration de soupçon</h2>
<p>Les signaux d’alerte figurent dans chaque fiche de vigilance. Un signal fort non expliqué, ou deux signaux, entraînent la transmission du dossier au déclarant.</p>
<p><strong>Alerte interne.</strong> Tout collaborateur qui a un doute alerte le déclarant dans un délai maximal de ${n.delaiAlerte||"24 heures"}, oralement puis par écrit (modèle en annexe B), sans jamais en informer le client. Le déclarant accuse réception, analyse les éléments et rend sa décision dans un délai de ${n.delaiAnalyse||"5 jours ouvr\xE9s"}, et en tout état de cause avant la signature de l’avant-contrat lorsque c’est possible. L’analyse est écrite et conservée séparément, y compris lorsqu’elle conclut à l’absence de soupçon.</p>
<p><strong>Déclaration.</strong> Lorsque l’agence sait, soupçonne ou a de bonnes raisons de soupçonner que des sommes ou une opération proviennent d’une infraction passible d’une peine de plus d’un an d’emprisonnement ou participent au financement du terrorisme, le déclarant effectue une déclaration de soupçon à Tracfin sur ERMES (${m.L561_15}), en principe avant l’exécution de l’opération (${m.L561_24}).</p>
<p><strong>Confidentialité.</strong> L’existence et le contenu d’une déclaration ne sont jamais révélés au client ni à un tiers (${m.L561_18}). La divulgation est pénalement sanctionnée (${m.L574_1}).</p>

<h2>10. Abstention et refus</h2>
<p>Si l’identité d’une partie ne peut être vérifiée, ou si les informations sur l’opération ne peuvent être obtenues, l’agence n’exécute pas l’opération et le dossier est transmis au déclarant (${m.L561_8}).</p>

<h2>11. Conservation des documents</h2>
<p>Les fiches de vigilance, les copies des pièces et les justificatifs sont conservés pendant 5 ans à compter de la clôture de l’opération ou de la fin de la relation (${m.L561_12}). Ils sont classés par opération${n.archivage?" ("+n.archivage+")":""}, l’accès en est réservé aux personnes habilitées et ils peuvent être produits sans délai en cas de contrôle. Les justificatifs de formation sont conservés pendant la durée des fonctions de chaque collaborateur, puis 5 ans après son départ (${m.D561_38_1_1}).</p>

<h2>12. Formation des collaborateurs</h2>
<p>Chaque personne qui participe aux obligations LCB-FT est formée dès son arrivée, avant de participer aux diligences, puis tous les ${e.periodicite("negociateur")} mois au plus. La formation est adaptée à la classification des risques de l’agence et à la fonction de chacun, et comprend un volet sur les sanctions encourues (${m.L561_34} ; ${m.D561_38_1_1}). Chaque formation donne lieu à une évaluation, une attestation nominative et une inscription au registre des formations.</p>

<h2>13. Contrôle interne et mise à jour</h2>
<p>Au moins une fois par an, le responsable du dispositif réalise un auto-contrôle : revue d’un échantillon de fiches de vigilance (au moins 10 % des opérations de l’année et toutes les opérations en vigilance renforcée), vérification de la formation de chaque collaborateur et mise à jour de la classification. Les constats et le plan d’action sont consignés. Les procédures sont revues après chaque auto-contrôle et à chaque évolution réglementaire.</p>

<h2>2. Missions</h2>
<p><strong>Le déclarant</strong> est habilité à établir, signer et transmettre à Tracfin les déclarations de soupçon de l’agence. Il reçoit et analyse les alertes internes, décide des suites à leur donner et conserve, de façon strictement confidentielle, les analyses, les déclarations et les accusés de réception.</p>
